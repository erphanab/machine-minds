# Your submission. Run: uv run run.py --submit
# v4 (the v3 request q481f22 was sent from ../PhysicalAI-Hackathon-2026).

team: Machine Minds
contact: Souvik Roy   # e-mail left out of the public copy
policy: MachineMinds-v6-ClosedLoop   # YOLO11s-seg (1080p) + outline grasp (cubes, screws) / pose fit (AAA cells) -> bin assignment + grasp/order planner, wrist-camera grasp check, IK-checked TCP waypoints

# Choose the closest model type. This does not affect scoring.
model_type: Hybrid
# VA          Images -> actions (ACT, Diffusion Policy)
# VLA         Images + instructions -> actions (NVIDIA GR00T)
# WAM         Predicts future states to guide robot actions
# VLM + BM    A VLM decides what to do; a behavior model executes actions
# TAMP + FMs  Foundation models assist task and motion planning
# Hybrid      Combines multiple approaches, or choose this if unsure

# --- Task ---
task_id: sort-bins-machine-minds
task: "Sort the objects so each of the 3 yellow bins holds only one type; the robot chooses which bin gets which type. Leave the distractor (cap or tube) where it is. Bring-your-own items: 3 printed tangerine-yellow bins (90 x 90 x 65 mm) and AAA cells; cubes must be 10 mm."
                                  # Success: each bin holds only one type, every target is in a bin, the distractor (cap or tube) is not picked.

# --- Test Setup ---
# Tell us how to prepare the workspace for each rollout.
# Objects and layout can stay the same or change between rollouts.

objects: different
# same: Use the same set of objects for every rollout.
# different: May use different objects across rollouts.
# Each rollout: 4-5 targets (cube, AAA cell, screw; each at least once) + 1 distractor (cap or tube); see placement.yaml.

layout: different
# same: Place objects in the same positions for every rollout.
# different: May change object positions across rollouts.
# The three bins stay at the same fixed positions in every rollout; the objects move (placement.yaml).

# --- Evaluation ---
rollouts: 10                      # Number of attempts in this test
                                  # Each attempt is scored success or failure

# --- Hardware ---
custom_hardware: none            # Describe any hardware changes (e.g., 3D-printed fingers)
